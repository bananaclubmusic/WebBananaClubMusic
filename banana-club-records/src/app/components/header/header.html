<header class="navbar">

  <div class="nav-container">

    <!-- HAMBURGER (mobile) -->
    <div class="hamburger-nav">

      <button class="hamburger"
              (click)="toggleMenu()"
              [class.active]="menuOpen"
              aria-label="Toggle Navigation">

        <span></span>
        <span></span>
        <span></span>

      </button>

      <nav class="hamburger-menu" [class.open]="menuOpen">
        <a routerLink="/" (click)="toggleMenu()">Inicio</a>
        <a routerLink="/people" (click)="toggleMenu()">Fundador</a>
        <a routerLink="/artists" (click)="toggleMenu()">Artistas</a>
        <a routerLink="/about" (click)="toggleMenu()">Sobre Nosotros</a>
      </nav>

    </div>

    <!-- BACK ARROW -->
    <button class="back-arrow" (click)="goBack()" aria-label="Volver">
      ←
    </button>

    <!-- DESKTOP NAV -->
    <nav class="mini-nav">
      <a routerLink="/" routerLinkActive="active">Inicio</a>
      <a routerLink="/people" routerLinkActive="active">Fundador</a>
      <a routerLink="/artists" routerLinkActive="active">Artistas</a>
      <a routerLink="/about" routerLinkActive="active">Sobre Nosotros</a>
    </nav>

  </div>

</header>
