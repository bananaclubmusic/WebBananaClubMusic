<div class="floating-bg"></div>

<header class="navbar">
  <div class="nav-container">
    <div class="hamburger-nav">
      <button class="hamburger" (click)="toggleMenu()" [class.active]="menuOpen" aria-label="Toggle Navigation">
        <span></span>
        <span></span>
        <span></span>
      </button>

      <nav class="hamburger-menu" [class.open]="menuOpen">
        <a routerLink="/people" (click)="toggleMenu()">Fundador</a>
        <a routerLink="/artists" (click)="toggleMenu()">Artistas</a>
        <a routerLink="/about" (click)="toggleMenu()">Sobre Nosotros</a>
      </nav>
    </div>

    <div class="nav-brand">
      <span class="brand-text">BANANA CLUB</span>

<main class="home-main">
  <section class="hero">
    <div class="container hero-content">
      <h1 class="home-title">BANANA CLUB</h1>
      <p class="tagline">Independent electronic label. Breakbeat & UK Garage</p>

      <div class="cta-wrapper">
        <a class="demo-button" href="mailto:demos@tusello.com?subject=Demo%20Submission">
          ENVIAR DEMO
        </a>
      </div>
    </div>
  </section>

  <section class="social-section">
    <div class="social-links">
      <a href="https://www.instagram.com/banana_club_music/" target="_blank" rel="noopener" class="social-link">
        <img src="assets/images/instagram.png" alt="Instagram">
      </a>

      <a href="https://soundcloud.com/thebananaclub" target="_blank" rel="noopener" class="social-link">
        <img src="assets/images/soundcloud.png" alt="SoundCloud">
      </a>

      <a href="https://www.beatport.com/label/banana-club/87402" target="_blank" rel="noopener" class="social-link">
        <img src="assets/images/beatport.svg" alt="Beatport">

    </div>
  </section>

  <footer class="footer">
    <div class="container footer-content">

    </div>
  </footer>
