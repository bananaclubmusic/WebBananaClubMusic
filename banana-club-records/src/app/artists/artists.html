<app-header></app-header>

<main class="artists-main">


  <section class="artists-intro">

    <div class="artists-content">

      <h1 class="artists-title">Artistas</h1>

      <p>
        Estos son algunos de los artistas colaboradores del sello
        <span class="brand">Banana Club</span>.
        Productores y DJs que comparten nuestra visión del Breakbeat y el UKG.
      </p>

    </div>

  </section>

  <!-- GRID -->
  <div class="artists-grid">

    <article
      class="artist-card"
      [ngClass]="artist.name.toLowerCase().replace(' ', '-')"
      *ngFor="let artist of artists"
    >

      <!-- IMAGE / TRIGGER -->
      <div
        class="artist-media"
        (click)="openModal(artist)"
      >
        <img
          [src]="artist.images[0]"
          [alt]="artist.name"
        >
      </div>

      <!-- NAME -->
      <h2 class="artist-name">
        {{ artist.name }}
      </h2>

    </article>

  </div>

  <!-- MODAL -->
  <div
    class="artist-modal"
    *ngIf="activeArtist"
    [class.mbreaks]="activeArtist.name === 'MBreaks'"
    [class.pavane]="activeArtist.name === 'Pavane'"
    [class.bowser]="activeArtist.name === 'Bowser'"
    [class.rhades]="activeArtist.name === 'Rhades'"
    [class.cooltasty]="activeArtist.name === 'CoolTasty'"
    [class.sellrude]="activeArtist.name === 'SellRude'"
    [class.cude]="activeArtist.name === 'Cude'"
    [class.fm3]="activeArtist.name === 'FM-3'"
    [class.guau]="activeArtist.name === 'Guau'"
    [class.jottafrank]="activeArtist.name === 'JottaFrank'"
    [class.buson]="activeArtist.name === 'Buson'"
    [class.runthebreaks]="activeArtist.name === 'Run The Breaks'"
    (click)="closeModal()"
  >

    <div
      class="artist-modal-content"
      (click)="$event.stopPropagation()"
    >

      <!-- CLOSE -->
      <button
        class="modal-close"
        (click)="closeModal()"
        aria-label="Cerrar"
      >
        ×
      </button>

      <!-- MEDIA -->
      <div class="modal-media">

        <div class="carousel">
          <div
            class="carousel-track"
            [style.transform]="'translateX(-' + activeArtist.currentIndex * 100 + '%)'"
          >
            <img
              *ngFor="let img of activeArtist.images"
              [src]="img"
              [alt]="activeArtist.name"
            >
          </div>
        </div>

        <button
          *ngIf="activeArtist.images.length > 1"
          class="nav prev"
          (click)="prevImage(activeArtist)"
        >
          ‹
        </button>

        <button
          *ngIf="activeArtist.images.length > 1"
          class="nav next"
          (click)="nextImage(activeArtist)"
        >
          ›
        </button>

      </div>

      <!-- TEXT -->
      <div class="modal-text">

        <h1>{{ activeArtist.name }}</h1>

        <p>
          {{ activeArtist.description }}
        </p>

        <div class="artist-socials">

          <a
            *ngIf="activeArtist.instagram"
            [href]="activeArtist.instagram"
            target="_blank"
            aria-label="Instagram"
          >
            <img src="assets/images/instagram.png" class="social-icon instagram">
          </a>

          <a
            *ngIf="activeArtist.soundcloud"
            [href]="activeArtist.soundcloud"
            target="_blank"
            aria-label="SoundCloud"
          >
            <img src="assets/images/soundcloud.png" class="social-icon soundcloud">
          </a>

          <a
            *ngIf="activeArtist.beatport"
            [href]="activeArtist.beatport"
            target="_blank"
            aria-label="Beatport"
          >
            <img src="assets/images/beatport.svg" class="social-icon beatport">
          </a>

        </div>

      </div>

    </div>

  </div>

</main>
<app-footer></app-footer>
